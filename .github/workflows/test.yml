name: Test

on:
  pull_request:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**/README*.md'
      - '**/BUILDING.md'
      - '.github/FUNDING.yml'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: read # to fetch code (actions/checkout)

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Free up disk space in runner
        uses: ./.github/actions/disk-cleanup

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Copy Docker gradle.properties
        run: |
          cp gradle.properties.docker "$GRADLE_USER_HOME/gradle.properties"
          echo 'org.gradle.jvmargs=-Xmx6g -XX:+UseParallelGC -XX:+UnlockExperimentalVMOptions -XX:hashCode=3' >> "$GRADLE_USER_HOME/gradle.properties"

      - name: Build the debug app
        run: ./gradlew --max-workers=2 :app:assembleProdWebsiteDebug

      - name: Run the unit tests
        run: ./gradlew --max-workers=2 :app:testProdWebsiteDebugUnitTest

      - name: Lint
        run: ./gradlew --max-workers=2 :app:lintProdWebsiteDebug

      - name: Check the APK
        run: tools/apk-report.sh --known-4k=libargon2.so,libnative-utils.so app/build/outputs/apk/prodWebsite/debug/app-prod-website-debug.apk

      - name: Archive reports for failed build
        if: "failure()"
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ github.run_id }}
          path: |
            **/build/reports
            **/build/test-results
          if-no-files-found: ignore
