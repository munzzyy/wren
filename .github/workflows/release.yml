name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build"
        required: true

permissions:
  contents: read # to fetch code (actions/checkout)

env:
  TAG_REF: "${{ github.event.inputs.tag || github.ref_name }}"
  BUILD_ENV_FILE: ${{ vars.BUILD_ENV_FILE || 'beta-stable.env' }}
  HAVE_KEYSTORE: ${{ secrets.SECRET_KEYSTORE != '' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04

    steps:
      - name: Check tag name
        run: |
          if ! [[ "$TAG_REF" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "Unexpected tag name" >&2
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: "${{ env.TAG_REF }}"

      - name: Free up disk space in runner
        uses: ./.github/actions/disk-cleanup

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Build Docker image
        run: docker compose build
        working-directory: reproducible-builds

      - name: Export CI environment variables
        run: |
          cp -v "ci/$BUILD_ENV_FILE" .env
          for var in APP_TITLE APP_FILENAME PACKAGE_ID \
                     BUILD_VARIANTS FORCE_INTERNAL_USER_FLAG \
                     MAPS_API_KEY; do
            if [ -n "${!var}" ]; then
              echo "Setting CI_$var=${!var}"
              echo "CI_$var=${!var}" >> $GITHUB_ENV
            fi
          done
        working-directory: reproducible-builds
        env:
          APP_TITLE: ${{ vars.CI_APP_TITLE }}
          APP_FILENAME: ${{ vars.CI_APP_FILENAME }}
          PACKAGE_ID: ${{ vars.CI_PACKAGE_ID }}
          BUILD_VARIANTS: ${{ vars.CI_BUILD_VARIANTS }}
          FORCE_INTERNAL_USER_FLAG: ${{ vars.CI_FORCE_INTERNAL_USER_FLAG }}

      - name: Extract signing keys
        if: "env.HAVE_KEYSTORE == 'true'"
        run: printenv KEYSTORE | base64 -d > certs/keystore.jks
        working-directory: reproducible-builds
        env:
          KEYSTORE: ${{ secrets.SECRET_KEYSTORE }}

      - name: Build without signing
        if: "env.HAVE_KEYSTORE == 'false'"
        run: docker compose run -v "$GRADLE_USER_HOME/caches:/.gradle-ro-cache:ro" assemble
        working-directory: reproducible-builds

      - name: Build and sign
        if: "env.HAVE_KEYSTORE == 'true'"
        run: docker compose run -v "$GRADLE_USER_HOME/caches:/.gradle-ro-cache:ro" assemble
        working-directory: reproducible-builds
        env:
          CI_KEYSTORE_PATH: certs/keystore.jks
          CI_KEYSTORE_ALIAS: ${{ secrets.SECRET_KEYSTORE_ALIAS }}
          CI_KEYSTORE_PASSWORD: ${{ secrets.SECRET_KEYSTORE_PASSWORD }}

      - name: Clean up keystore
        if: "always()"
        run: rm -f certs/keystore.jks
        working-directory: reproducible-builds

      - name: Name release assets
        run: ./name-outputs.sh "$TAG_REF" "$GITHUB_WORKSPACE/dist"
        working-directory: reproducible-builds

      - name: Compute checksums and notes
        run: |
          cd dist
          sha256sum ./*.apk | sed 's# \./# #' | tee SHA256SUMS
          commit=$(git rev-parse --short=12 HEAD)
          signal=$(sed -n 's/^val canonicalVersionName = "\(.*\)"/\1/p' ../app/build.gradle.kts)
          if [ "$HAVE_KEYSTORE" = "true" ]; then
            state="Signed with the release key."
          else
            state="Unsigned. Sign them yourself before installing, see BUILDING.md."
          fi
          {
            echo "Wren $TAG_REF, built from commit $commit, based on Signal $signal."
            echo
            echo "$state"
            echo
            echo "Wren-<version>.apk is the universal build without the in-app updater (GitHub and Obtainium)."
            echo "Wren-<version>-arm64-v8a.apk, -armeabi-v7a.apk and -x86_64.apk are the same build for one CPU, a much smaller download."
            echo "Most phones want arm64-v8a. Wren-website-<version> files are the builds with the in-app updater."
            echo
            echo "SHA-256:"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
            echo
            echo "To check that these match the source, follow reproducible-builds/README.md."
          } > release-notes.md

      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            dist/*.apk
            dist/SHA256SUMS
            dist/release-notes.md
          if-no-files-found: error

  draft_release:
    name: Draft release
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write # to create the draft release and upload assets

    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist

      - name: Check version for upgrade compatibility
        run: |
          mkdir latest
          name=$(gh release view --json assets --jq '
            [.assets[].name
             | select(test("^Wren-(unsigned-)?v.*\\.apk$"))
             | select(test("-(arm64-v8a|armeabi-v7a|x86_64)\\.apk$") | not)]
            | sort | .[0] // empty') || name=""
          if [ -z "$name" ]; then
            echo "No published release to compare with"
            exit 0
          fi
          gh release download --pattern "$name" --dir latest
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          version_code() {
            "$aapt" d badging "$1" | sed -n "s/^package:.*versionCode='\([0-9]*\)'.*/\1/p"
          }
          pick() {
            find "$1" -maxdepth 1 -name 'Wren-*.apk' ! -name '*website*' \
              ! -name '*-arm64-v8a.apk' ! -name '*-armeabi-v7a.apk' ! -name '*-x86_64.apk' | sort | head -1
          }
          latest=$(version_code "$(pick latest)")
          build=$(version_code "$(pick dist)")
          echo "Latest version code: $latest"
          echo "Build version code: $build"
          if [ "$build" -le "$latest" ]; then
            echo "Build version code must be greater than the latest version code" >&2
            exit 1
          fi

      - name: Create draft release
        run: |
          if gh release view "$TAG_REF" > /dev/null 2>&1; then
            gh release upload "$TAG_REF" dist/*.apk dist/SHA256SUMS --clobber
          else
            gh release create "$TAG_REF" -d --verify-tag -t "Wren $TAG_REF" \
              -F dist/release-notes.md dist/*.apk dist/SHA256SUMS
          fi
